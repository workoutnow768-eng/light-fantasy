name: Daily Light Fantasy Bot

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    name: Daily Light Fantasy Bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate videos
        env:
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          MUSIC_TRACK_URL: ${{ secrets.MUSIC_TRACK_URL }}
        run: python scripts/main.py generate

      - name: Commit generated videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/light_fantasy
          git diff --staged --quiet || git commit -m "Add generated light-fantasy videos"
          git push

      - name: Schedule posts
        env:
          BUFFER_ACCESS_TOKEN_LIGHTFANTASY: ${{ secrets.BUFFER_ACCESS_TOKEN_LIGHTFANTASY }}
        run: python scripts/main.py schedule

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/light_fantasy_state.json output/light_fantasy
          git diff --staged --quiet || git commit -m "Update rotation state"
          git push
